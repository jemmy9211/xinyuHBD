<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mika - 3D棕熊捕魚</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='16'>❤️</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Quicksand:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/mika-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <!-- Minimal Navbar -->
    <nav class="navbar">
        <a class="navbar-brand" href="./index.html">Xinyu</a>
        <ul class="navbar-nav">
            <li>
                <a class="nav-link" href="./index.html">
                    <i class="bi bi-house"></i> <span>Home</span>
                </a>
            </li>
            <li>
                <a class="nav-link" href="./about.html">
                    <i class="bi bi-image"></i> <span>Pictures</span>
                </a>
            </li>
            <li>
                <a class="nav-link active" href="./mika.html">
                    <i class="bi bi-heart"></i> <span>Mika</span>
                </a>
            </li>
        </ul>
    </nav>

    <div id="game-container">
        <canvas id="game-canvas"></canvas>
        
        <div class="ui-overlay">
            <div class="score">捕獲: 0</div>
            <div class="timer">時間: 90</div>
            <div class="game-controls">
                <kbd>W</kbd> 前進 <kbd>S</kbd> 後退 <kbd>A</kbd> 左轉 <kbd>D</kbd> 右轉 <kbd>空格</kbd> 切換視角<br>
                🐟 連續捕魚獲得連擊加成！收集 ⚡🧲❄️⏰ 道具獲得特殊效果！
            </div>
        </div>
        
        <div class="game-over">
            <h1>遊戲結束!</h1>
            <div class="final-score">你捕獲了 0 條鮭魚!</div>
            <div>
                <button onclick="window.restartGame()">再玩一次</button>
                <button onclick="window.goToHomePage()">返回主頁</button>
            </div>
        </div>
    </div>

    <script src="js/mika-3d-game.js"></script>
</body>
</html>
